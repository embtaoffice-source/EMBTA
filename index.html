<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/embta-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMBTA - Eastern Maring Business & Traders Association</title>
    <meta name="description" content="Official Portal of the Eastern Maring Business & Traders Association (EMBTA). Connecting Businesses, Strengthening Communities." />
    <meta name="keywords" content="EMBTA, Eastern Maring Business & Traders Association, Maring Traders, Commerce, Manipur, Business Association" />
    <meta property="og:title" content="Eastern Maring Business & Traders Association | EMBTA" />
    <meta property="og:description" content="Connecting Businesses. Strengthening Communities. Official Digital Portal." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/embta-logo.png" />
    <!-- Single Page Apps for GitHub Pages URL Restorer -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-embta-navy text-embta-light font-sans antialiased selection:bg-embta-green selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
